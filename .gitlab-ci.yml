{
  "workflow": {
    "rules": [
      {
        "if": "$CI_PIPELINE_SOURCE == \"api\""
      },
      {
        "when": "never"
      }
    ]
  },
  "stages": [
    "benchmark",
    "backend"
  ],
  "default": {
    "tags": [
      "$BENCH_RUNNER_TAG"
    ],
    "timeout": "1h",
    "interruptible": false
  },
  "variables": {
    "GIT_STRATEGY": "clone",
    "GIT_DEPTH": "1",
    "GIT_SUBMODULE_STRATEGY": "none"
  },
  "cache": [],
  "frontend": {
    "stage": "benchmark",
    "image": {
      "name": "node:22.22.0-bookworm@sha256:20a424ecd1d2064a44e12fe287bf3dae443aab31dc5e0c0cb6c74bef9c78911c",
      "entrypoint": [
        ""
      ]
    },
    "variables": {
      "BENCH_WORKLOAD": "frontend"
    },
    "script": [
      "sh .benchmark-run.sh"
    ],
    "artifacts": {
      "when": "always",
      "expire_in": "1 week",
      "paths": [
        ".bench/results.jsonl",
        "frontend/dist/"
      ]
    }
  },
  "backend": {
    "stage": "backend",
    "image": {
      "name": "golang:1.26.1-bookworm@sha256:ab3d6955bbc813a0f3fdf220c1d817dd89c0b3f283777db8ece4a32fe7858edd",
      "entrypoint": [
        ""
      ]
    },
    "variables": {
      "BENCH_WORKLOAD": "backend"
    },
    "script": [
      "sh .benchmark-run.sh"
    ],
    "artifacts": {
      "when": "always",
      "expire_in": "1 week",
      "paths": [
        ".bench/results.jsonl"
      ]
    },
    "needs": [
      "frontend"
    ]
  }
}