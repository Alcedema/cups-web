stages: [verify, build, release, sync]

# Project-locked Linux Docker runner; jobs wait when it is offline.
default:
  tags: [cups-web-linux-docker]

variables:
  GIT_DEPTH: "0"
  CGO_ENABLED: "0"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"

.candidate:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "merge_request_event"'

release-policy:
  extends: .candidate
  stage: verify
  image: python:3.13.7-bookworm@sha256:c900d35aba5fe4c1dc1cd358408baae2902ff2a2926a1d15cc5002c6061ddb2e
  script:
    - python scripts/test_release_policy.py
    - if [ -n "$CI_COMMIT_TAG" ]; then git fetch origin main:refs/remotes/origin/main --tags; fi
    - python scripts/release_policy.py

frontend:
  extends: .candidate
  stage: verify
  image: node:22.22.0-bookworm@sha256:20a424ecd1d2064a44e12fe287bf3dae443aab31dc5e0c0cb6c74bef9c78911c
  script:
    - cd frontend
    - npx --yes npm@11.6.2 ci --prefer-offline
    - npm run check:translations
    - npm test
    - npm run build
    - cmp ../LICENSE dist/LICENSE.txt
  cache:
    key:
      prefix: npm-node22
      files: [frontend/package-lock.json]
    paths: [.cache/npm/]
  artifacts:
    paths: [frontend/dist/]
    expire_in: 1 week

backend:
  extends: .candidate
  stage: build
  image: golang:1.26.1-bookworm@sha256:ab3d6955bbc813a0f3fdf220c1d817dd89c0b3f283777db8ece4a32fe7858edd
  needs: [frontend, release-policy]
  script:
    - go test ./...
    - go vet ./...
    - mkdir -p bin
    - VERSION="${CI_COMMIT_SHORT_SHA}"
    - if [ -n "$CI_COMMIT_TAG" ]; then VERSION="${CI_COMMIT_TAG#alcedema-v}"; fi
    - GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" -o bin/cups-web-linux-amd64 ./cmd/server
    - cp LICENSE bin/LICENSE.txt
    - cp release.json bin/RELEASE.json
    - cd bin
    - sha256sum cups-web-linux-amd64 > SHA256SUMS
    - printf '%s\n' "$CI_COMMIT_SHA" > SOURCE_COMMIT
  cache:
    key:
      prefix: go1.26.1-linux-amd64
      files: [go.sum]
    paths: [.cache/go-mod/, .cache/go-build/]
  artifacts:
    paths: [bin/]
    expire_in: 1 year

sync-tests:
  extends: .candidate
  stage: verify
  image: python:3.13.7-bookworm@sha256:c900d35aba5fe4c1dc1cd358408baae2902ff2a2926a1d15cc5002c6061ddb2e
  script:
    - python scripts/test_upstream_sync.py

release:
  stage: release
  image: python:3.13.7-bookworm@sha256:c900d35aba5fe4c1dc1cd358408baae2902ff2a2926a1d15cc5002c6061ddb2e
  needs: [backend, frontend, release-policy, sync-tests]
  resource_group: release-publication
  rules:
    - if: '$CI_COMMIT_TAG =~ /^alcedema-v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - git fetch origin main:refs/remotes/origin/main --tags
    - python scripts/publish_release.py

upstream-sync:
  stage: sync
  image: python:3.13.7-bookworm@sha256:c900d35aba5fe4c1dc1cd358408baae2902ff2a2926a1d15cc5002c6061ddb2e
  resource_group: upstream-sync
  environment:
    name: upstream-sync
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - python scripts/upstream_sync.py
